<html>
<head>
    <title>Export</title>
    <meta charset="UTF-8">
    <script src="export.js" type="module"></script>
    <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<select id="panel"></select>
<h1>Export</h1>
<p class="subtitle">
    Backup, restore, or synchronize your rules and settings across devices. (<a href="help.html#export" title="Help">?</a>)
</p>
<div>
    <input type="file" id="file" accept=".json,application/json" hidden>
    <button id="import" title="Import rules and settings from a JSON file">Import</button>
    <button id="download" title="Download rules and settings as a JSON file">Download</button>
    <button id="push" title="Push rules to cloud">Push</button>
    <button id="pull" title="Pull rules from cloud">Pull</button>
</div>
<hr>
<div id="lastpush"></div>
<hr>
<p>
    <label for="export">Only import backups from sources you trust.</label>
</p>
<textarea id="export" spellcheck="false" title="Your rules and settings as JSON. Copy to back them up, or paste a backup here and click Save.">
</textarea>
<p>
    <button id="save" title="Apply rules and settings from the text box">Save</button>
</p>
</body>
</html>
