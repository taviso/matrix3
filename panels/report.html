<html>
<head>
    <title>Report</title>
    <meta charset="UTF-8">
    <script src="report.js" type="module"></script>
    <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<template id="sources-template">
    <colgroup>
        <col class=col-src>
        <col class=col-default-src>
        <col class=col-script-src>
        <col class=col-style-src>
        <col class=col-img-src>
        <col class=col-frame-src>
        <col class=col-font-src>
        <col class=col-media-src>
        <col class=col-connect-src>
        <col class=col-worker-src>
        <col class="col-child-src advanced">
        <col class="col-manifest-src advanced">
        <col class="col-object-src advanced">
    </colgroup>
    <thead>
        <tr>
            <th id=src title="Source">Source</th>
            <th id=default-src title="default-src">📌</th>
            <th id=script-src title="script-src">📜</th>
            <th id=style-src title="style-src">🦚</th>
            <th id=img-src title="img-src">🖼️</th>
            <th id=frame-src title="frame-src">🪟</th>
            <th id=font-src title="font-src">🔤</th>
            <th id=media-src title="media-src">📽️</th>
            <th id=connect-src title="connect-src">🔌</th>
            <th id=worker-src title="worker-src">🔧</th>
            <th id=child-src class="advanced" title="child-src">👶</th>
            <th id=manifest-src class="advanced" title="manifest-src">🪪</th>
            <th id=object-src class="advanced" title="object-src">🧩</th>
        </tr>
    </thead>
    <tbody>
    </tbody>
</template>
<select id="panel"></select>
<h1>Report</h1>
<p class="subtitle">
    Configure rules for the active website. (<a href="help.html#report" title="Help">?</a>)
</p>
<div>
    <button id="commit" title="Make these settings dynamic (persistent) rules">Commit</button>
    <button id="uncommit" title="Demote the dynamic rule for this host to a session rule">Uncommit</button>
    <button id="abandon" title="Discard session changes, restore the dynamic rule">Abandon</button>
    <button id="reset" title="Remove all session and dynamic rules for this host">Reset</button>
    <button id="disable" title="Temporarily disable matrix³ on this tab">Disable</button>
    <button id="resume" title="Re-enable matrix³ on this tab" disabled>Resume</button>
    <button id="reload" title="Reload active tab (Hold shift to bypass cache)">Reload</button>
</div>
<hr>
<div id="trustcontrol">
    <label for="trustgroup" title="Manage saved rules in Groups...">Groups</label>
    <div>
        <select id="trustgroup"></select>
        <button id="applygroup" title="Apply the selected group's rules">Apply</button>
    </div>
    <hr>
</div>
<div>
    <table id="sources" class="sources">
        <caption>
            Source Directives
            <div id=frames></div>
        </caption>
    </table>
</div>
<br>
<hr>
<div>
    <table id="sandbox">
        <caption>Sandbox Directives</caption>
        <thead>
            <tr>
            <th><label for=sandbox-enabled>Enabled</label></th>
            <td><input type=checkbox id=sandbox-enabled class=sandbox></td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th><label for=allow-downloads>Downloads</label></th>
                <td><input type=checkbox id=allow-downloads class="sandbox allow"></td>
            </tr>
            <tr>
                <th><label for=allow-forms>Forms</label></th>
                <td><input type=checkbox id=allow-forms class="sandbox allow"></td>
            </tr>
            <tr>
                <th><label for=allow-modals>Modals</label></th>
                <td><input type=checkbox id=allow-modals class="sandbox allow"></td>
            </tr>
            <tr class="advanced">
                <th><label for=allow-orientation-lock>Orientation Lock</label></th>
                <td><input type=checkbox id=allow-orientation-lock class="sandbox allow"></td>
            </tr>
            <tr class="advanced">
                <th><label for=allow-pointer-lock>Pointer Lock</label></th>
                <td><input type=checkbox id=allow-pointer-lock class="sandbox allow"></td>
            </tr>
            <tr>
                <th><label for=allow-popups>Popups</label></th>
                <td><input type=checkbox id=allow-popups class="sandbox allow"></td>
            </tr>
            <tr>
                <th><label for=allow-popups-to-escape-sandbox>Popups Escape Sandbox</label></th>
                <td><input type=checkbox id=allow-popups-to-escape-sandbox class="sandbox allow"></td>
            </tr>
            <tr class="advanced">
                <th><label for=allow-presentation>Presentation</label></th>
                <td><input type=checkbox id=allow-presentation class="sandbox allow"></td>
            </tr>
            <tr>
                <th><label for=allow-same-origin>Same Origin</label></th>
                <td><input type=checkbox id=allow-same-origin class="sandbox allow"></td>
            </tr>
            <tr>
                <th><label for=allow-scripts>Scripts</label></th>
                <td><input type=checkbox id=allow-scripts class="sandbox allow"></td>
            </tr>
            <tr class="advanced">
                <th><label for=allow-storage-access-by-user-activation>Storage Access by User Activation</label></th>
                <td><input type=checkbox id=allow-storage-access-by-user-activation class="sandbox allow"></td>
            </tr>
            <tr>
                <th><label for=allow-top-navigation>Top Navigation</label></th>
                <td><input type=checkbox id=allow-top-navigation class="sandbox allow"></td>
            </tr>
            <tr class="advanced">
                <th><label for=allow-top-navigation-by-user-activation>Top Navigation by User Activation</label></th>
                <td><input type=checkbox id=allow-top-navigation-by-user-activation class="sandbox allow"></td>
            </tr>
            <tr class="advanced">
                <th><label for=allow-top-navigation-to-custom-protocols>Top Navigation to Custom Protocols</label></th>
                <td><input type=checkbox id=allow-top-navigation-to-custom-protocols class="sandbox allow"></td>
            </tr>
        </tbody>
    </table>
</div>
<div id="serverpolicy">
    <br>
    <hr>
    <details>
        <summary>Server Suggested Policy</summary>
        <div>
            <table id="serversources" class="sources"></table>
        </div>
        <textarea id=servercsp readonly></textarea>
        <p>
            <button id="accept" title="Replace sources with the suggested policy">Accept</button>
            <button id="merge" title="Add the suggested sources to the current selection">Merge</button>
        </p>
    </details>
</div>
</body>
</html>
