<html>
<head>
    <title>Rules</title>
    <meta charset="UTF-8">
    <script src="rules.js" type="module"></script>
    <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<select id="panel"></select>
<h1>Rules</h1>
<p class="subtitle">
    View and manage active session, dynamic, and static rules. (<a href="help.html#rules" title="Help">?</a>)
</p>
<p>
    <input type="text" id="filter" placeholder="Filter..." title="Filter by host, directive, or source (e.g. example.com or worker-src 'self')">
</p>
<p>
<table id="session">
    <caption>Session Rules</caption>
</table>
</p>
<p id="sessioncontrols">
    <button id="selectsession" title="Select all session rules">Select All</button>
    <button id="invertsession" title="Invert session rule selection">Invert</button>
    <button id="commit" title="Promote checked session rules into dynamic rules">Commit</button>
    <button id="removesession" title="Remove checked session rules">Remove</button>
</p>
<p>
<table id="dynamic">
    <caption>Dynamic Rules</caption>
</table>
</p>
<p id="dynamiccontrols">
    <button id="selectdynamic" title="Select all dynamic rules">Select All</button>
    <button id="invertdynamic" title="Invert dynamic rule selection">Invert</button>
    <button id="uncommit" title="Demote checked dynamic rules to session rules">Uncommit</button>
    <button id="removedynamic" title="Remove checked dynamic rules">Remove</button>
</p>
<p>
<table id="static">
    <caption>Static Rulesets</caption>
</table>
</p>
</body>
</html>
